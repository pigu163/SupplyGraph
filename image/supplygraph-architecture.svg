<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="supplygraph-architecture-title supplygraph-architecture-desc" id="supplygraph-architecture-root">
      <title id="supplygraph-architecture-title">SupplyGraph: from source data to structural analysis</title>
      <desc id="supplygraph-architecture-desc">AnonNet company and relationship files feed DeBERTa category prediction. Categorized company records and original edges are used separately by NetworkX and by the Neo4j importer. Both support structural analysis and reports. Supplier alternatives and capacity-aware simulation are planned.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #supplygraph-architecture-root { color: #2d3142; font-family: 'Geist', Arial, sans-serif; }
      #supplygraph-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#supplygraph-architecture-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="supplygraph-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/>
        </marker>
      </defs>
      <rect x="0" y="0" width="1280" height="720" fill="#f5f5f5"/>
      <text x="48" y="56" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="12" letter-spacing="1.4">SUPPLYGRAPH / CURRENT ARCHITECTURE</text>
      <text x="48" y="104" fill="#2d3142" font-family="'Instrument Serif', Georgia, serif" font-size="36">From company records to graph evidence</text>
      <text x="48" y="136" fill="#4f5d75" font-family="'Geist', Arial, sans-serif" font-size="16">A local snapshot supports two complementary analysis paths.</text>

      <g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#supplygraph-architecture-arrow)">
        <line x1="228" y1="306" x2="276" y2="306"/>
        <line x1="456" y1="306" x2="504" y2="306"/>
        <line x1="602" y1="424" x2="602" y2="356"/>
        <path d="M700 284 H720 Q728 284 728 276 V202 Q728 194 736 194 H752"/>
        <path d="M700 328 H720 Q728 328 728 336 V410 Q728 418 736 418 H752"/>
        <path d="M952 194 H976 Q984 194 984 202 V276 Q984 284 992 284 H1032"/>
        <path d="M952 418 H976 Q984 418 984 410 V336 Q984 328 992 328 H1032"/>
      </g>

      <g font-family="'Geist', Arial, sans-serif">
        <rect x="48" y="256" width="180" height="100" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
        <text x="64" y="280" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">SOURCE</text>
        <text x="64" y="308" fill="#2d3142" font-size="16" font-weight="600">AnonNet nodes</text>
        <text x="64" y="334" fill="#4f5d75" font-size="12">Company descriptions</text>

        <rect x="276" y="256" width="180" height="100" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
        <text x="292" y="280" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">PREDICT</text>
        <text x="292" y="308" fill="#2d3142" font-size="16" font-weight="600">DeBERTa</text>
        <text x="292" y="334" fill="#4f5d75" font-size="12">17 categories · MPS</text>

        <rect x="504" y="256" width="196" height="100" rx="6" fill="#fff7f3" stroke="#bf4520" stroke-width="2"/>
        <text x="520" y="280" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">LOCAL SNAPSHOT</text>
        <text x="520" y="308" fill="#2d3142" font-size="16" font-weight="600">Prepared records</text>
        <text x="520" y="334" fill="#4f5d75" font-size="12">Predicted nodes + raw edges</text>

        <rect x="504" y="424" width="196" height="88" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
        <text x="520" y="448" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">SOURCE</text>
        <text x="520" y="476" fill="#2d3142" font-size="16" font-weight="600">AnonNet edges</text>
        <text x="520" y="498" fill="#4f5d75" font-size="12">Reported company links</text>

        <rect x="752" y="144" width="200" height="100" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
        <text x="768" y="168" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">NETWORKX</text>
        <text x="768" y="196" fill="#2d3142" font-size="16" font-weight="600">Graph analysis</text>
        <text x="768" y="222" fill="#4f5d75" font-size="12">GraphML · removal scenarios</text>

        <rect x="752" y="368" width="200" height="100" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
        <text x="768" y="392" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">NEO4J</text>
        <text x="768" y="420" fill="#2d3142" font-size="16" font-weight="600">Graph database</text>
        <text x="768" y="446" fill="#4f5d75" font-size="12">Import · Cypher · GDS</text>

        <rect x="1032" y="256" width="200" height="100" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
        <text x="1048" y="280" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">OUTPUT</text>
        <text x="1048" y="308" fill="#2d3142" font-size="16" font-weight="600">Analysis reports</text>
        <text x="1048" y="334" fill="#4f5d75" font-size="12">Structure · evidence paths</text>
      </g>

      <line x1="48" y1="552" x2="1232" y2="552" stroke="#bfc0c0"/>
      <text x="48" y="584" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11">NEXT</text>
      <text x="112" y="584" fill="#2d3142" font-family="'Geist', Arial, sans-serif" font-size="15">Reusable queries · supplier candidates · capacity-aware simulation</text>
      <text x="48" y="640" fill="#4f5d75" font-family="'Geist', Arial, sans-serif" font-size="13">Categories are model predictions. The business meaning of source → target is unconfirmed.</text>
      <text x="48" y="664" fill="#4f5d75" font-family="'Geist', Arial, sans-serif" font-size="13">Paths describe potential structural exposure.</text>
    </svg>
